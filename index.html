<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projeto Prompt</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #f7f7fb;
        color: #171717;
      }
      main {
        background: #fff;
        border: 1px solid #e6e6ef;
        border-radius: 14px;
        padding: 24px;
        width: min(560px, 92vw);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.4rem;
      }
      p {
        margin: 0 0 18px;
        color: #50566a;
      }
      a {
        display: inline-block;
        text-decoration: none;
        background: #222;
        color: #fff;
        padding: 10px 14px;
        border-radius: 10px;
      }
      a:hover {
        filter: brightness(1.1);
      }
    </style>
  </head>

    <main>
      <h1>Projeto Prompt</h1>
      <p>Workspace ready. Open PromptBoard from the link below.</p>
